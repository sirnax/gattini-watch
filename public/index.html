<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gattini Watch</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2215%22 fill=%22%230f172a%22/%3E%3Cpath d=%22M12 49 16 14l12 14h10l11-14 4 35M22 42l4-3 4 3m9 0 4-3 4 3%22 fill=%22none%22 stroke=%22%23faf8f5%22 stroke-width=%224%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#fleet">Skip to projects</a>
  <header class="bar">
    <div class="brand">
      <span class="live" id="live" role="img" aria-label="Connection status"></span>
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M12 49 16 14l12 14h10l11-14 4 35M22 42l4-3 4 3m9 0 4-3 4 3" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h1>Gattini Watch</h1>
    </div>
    <div class="totals" id="totals" aria-live="off"></div>
    <button type="button" class="pause" id="pause" aria-pressed="false">⏸ Pause</button>
    <button type="button" class="pause stop" id="stop" title="Stop the Gattini Watch server">■ Stop</button>
  </header>

  <section class="controls" aria-label="View options" autocomplete="off">
    <div class="segmented" role="group" aria-label="Layout">
      <button type="button" data-view="tree">Tree</button>
      <button type="button" data-view="blocks">Blocks</button>
    </div>
    <label>Detail
      <select id="detail">
        <option value="glance">Glance</option>
        <option value="standard" selected>Standard</option>
        <option value="full">Full</option>
      </select>
    </label>
    <label>Order
      <select id="sort">
        <option value="steady">Steady (start time)</option>
        <option value="attention">Needs attention first (moves)</option>
        <option value="activity">Latest activity (moves)</option>
      </select>
    </label>
    <label>Project
      <select id="project"><option value="">All projects</option></select>
    </label>
    <label>Window
      <select id="hours">
        <option value="1">1 hour</option>
        <option value="3">3 hours</option>
        <option value="6" selected>6 hours</option>
        <option value="24">24 hours</option>
        <option value="72">3 days</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="finished" checked> Show finished</label>
    <label class="check"><input type="checkbox" id="guardian"> Show guardian reviews</label>
    <span class="updated" id="updated"></span>
  </section>

  <section class="now" id="now" aria-label="Working now"></section>
  <main id="fleet"></main>
  <footer class="legend" id="legend" aria-label="Key"></footer>
  <p class="audit" id="audit" aria-label="Log coverage"></p>

  <script type="module" src="/app.js"></script>
</body>
</html>
